{% extends 'computers/base.html' %}
{% block content %}
    <h1>Delete Computer</h1>
    <p>Are you sure you want to delete "{{ object.brand }} {{ object.model_name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm</button>
        <a href="{% url 'computer_detail' object.pk %}">Cancel</a>
    </form>
{% endblock %}
