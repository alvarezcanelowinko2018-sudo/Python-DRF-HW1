{% extends 'computers/base.html' %}
{% block content %}
    <h1>Computers</h1>
    <ul>
        {% for obj in object_list %}
            <li>
                <a href="{% url 'computer_detail' obj.pk %}">
                    {{ obj.brand }} {{ obj.model_name }}
                </a> - ${{ obj.price }}
            </li>
        {% empty %}
            <li>No records found.</li>
        {% endfor %}
    </ul>
{% endblock %}
